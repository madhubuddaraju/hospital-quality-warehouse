name: hospital_quality
version: "1.0.0"
config-version: 2
profile: hospital_quality

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

vars:
  # a reason score needs at least this many of its own measures reported
  min_reason_measures: 2

models:
  hospital_quality:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  hospital_quality:
    +schema: reference

snapshots:
  hospital_quality:
    +schema: history

flags:
  send_anonymous_usage_stats: false
