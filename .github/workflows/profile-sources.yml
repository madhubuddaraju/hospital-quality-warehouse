name: Profile sources

# Downloads the current release and past releases, then commits a column profile and a small
# real-data fixture (three states) used by the tests and for local development.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and profile
        run: python scripts/fetch_cms.py --history --profile 2>&1 | tee fetch.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Commit profile and fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add reports/source_profile.json tests/fixtures data/raw/manifest.json
          git commit -m "Profile CMS sources and refresh test fixtures" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Keep the log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -B fetch-log
          git add -f fetch.log && git commit -qm "fetch log" && git push -qf origin fetch-log
